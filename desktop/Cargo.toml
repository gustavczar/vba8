[package]
name = "vba8"
version = "0.1.0"
edition = "2021"
authors = ["Gustavo Cezar Lourenço"]
license-file = "../LICENSE"
description = "Recuperação local de projetos VBA autorizados"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vba8_core = { path = "../core" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
