[package]
name = "vba8_core"
version = "0.1.0"
edition = "2024"
license-file = "../LICENSE"
authors = ["Gustavo Cezar Lourenço"]
description = "Conservative local XLSM VBA project recovery without executing macros"

[dependencies]
cfb = "0.12"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
same-file = "1"
quick-xml = "0.38"

[workspace]
